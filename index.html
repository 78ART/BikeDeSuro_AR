<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Objeto AR</title>
    <!-- 1. AQUÍ LA LIBRERÍA OBLIGATORIA -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        /* 2. AQUÍ EL TAMAÑO PARA QUE NO MIDA 0 PÍXELES */
        model-viewer {
            width: 100%;
            height: 500px; /* Dale una altura fija de prueba */
            background-color: #f0f0f0; /* Fondo gris para ver si el recuadro existe */
            display: block;
        }
    </style>
</head>
<body>

    <h1>Mi objeto 3D</h1>

    <!-- 3. EL VISOR CON TU ARCHIVO -->
    <model-viewer src="https://github.com/78ART/BikeDeSuro_AR/blob/main/BikeSuroAR.glb"
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  shadow-intensity="1" 
                  auto-rotate>
    </model-viewer>

</body>
</html>
