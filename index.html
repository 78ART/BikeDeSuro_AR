<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver BikeSuro en AR</title>
    <!-- Importa el visor oficial de Google -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #eceff1; }
        model-viewer { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <H1>OBSERVA ESTO</H1>
    <!-- El código busca el archivo en la misma raíz de tu repositorio -->
    <model-viewer src="./BikeSuroAR.glb" 
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  touch-action="pan-y" 
                  shadow-intensity="1"
                  auto-rotate>
    </model-viewer>

</body>
</html>
